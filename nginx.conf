server {
    listen 80;
    listen [::]:80;
    server_name devel.xtatic.online;

    # Redirect to https
    location / {
        rewrite ^(.*) https://devel.xtatic.online:443$1 permanent;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devel.xtatic.online;

    # SSL Config
   # ssl_certificate /etc/letsencrypt/live/meeting.xtatic.online/fullchain.pem;
   # ssl_certificate_key /etc/letsencrypt/live/meeting.xtatic.online/privkey.pem;
   # ssl_trusted_certificate /etc/letsencrypt/live/meeting.xtatic.online/fullchain.pem;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;  # about 40000 sessions
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
   # set $prefix "";
   # set $custom_index "";
   #set $config_js_location /etc/jitsi/meet/jitsi.xtatic.online-config.js;

    ssl_certificate /etc/letsencrypt/live/devel.xtatic.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devel.xtatic.online/privkey.pem;

     gzip on;
    gzip_types text/plain text/css application/javascript application/json image/x-icon application/octet-stream application/wasm;
    gzip_vary on;
    gzip_proxied no-cache no-store private expired auth;
    gzip_min_length 512;


#     root /var/www/meeting;
#
