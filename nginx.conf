#
#     location / {
#         try_files $uri /index.html;
#     }

#    location /jupyter/ {
#         allow all;
#         deny all;
#        proxy_pass http://jupyter_server;
#    }

    location / {
	proxy_pass http://localhost:8210;
    }
}
